# ============================================
# File: .github/workflows/node-image.yml
# ============================================
# Creation Reason:
# - [TEE-NODE-IMAGE 2026-10-09 by Claude] Build the dstack node image in the
#   open, from a tag, and publish its digest with a build-provenance
#   attestation. A CVM quote measures the compose file, which pins this
#   digest, so a running TEE node can be traced to the exact public commit.
#
# Main Logical Flow:
# 1. Push of a tag `node-v*` (or manual dispatch on a ref).
# 2. Build linux/amd64 from deploy/node/Dockerfile and push to GHCR.
# 3. Attest provenance for the pushed digest and print it in the summary.
# ============================================

name: node-image

on:
  push:
    tags: ["node-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/aeronyxnetwork/aeronyx-node

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### aeronyx-node image"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- compose image line: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
