# ============================================
# File: crates/aeronyx-mailbox-wire/Cargo.toml
# ============================================
# [MAILBOX-WIRE 2026-10-09 by Claude] The single source of truth for the
# anonymous mailbox wire format and its client-side onion source, shared by
# the node and (vendored, hash-pinned) the Flutter client's Rust crate.
#
# Dependency ranges deliberately match what the client already locks
# (dalek 4 family: ed25519-dalek 2.2, x25519-dalek 2.0, chacha20poly1305
# 0.10, rand 0.8), so vendoring adds no new crate versions to the app.
# Keep this crate bytes-in/bytes-out: no node runtime, no I/O, no async.
# ============================================

[package]
name = "aeronyx-mailbox-wire"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "AeroNyx anonymous mailbox wire format and client onion source"
publish = false

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
serde_json = "1.0"
base64 = "0.21"

[dev-dependencies]
hex = "0.4"
