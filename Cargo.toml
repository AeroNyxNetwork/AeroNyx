# ============================================
# File: Cargo.toml (Workspace Root)
# ============================================
# AeroNyx Privacy Network - Workspace Configuration
# ============================================
# Modification Reason: Downgrade crypto library versions to match client
#
# CRITICAL VERSION ALIGNMENT:
# The client (Flutter/iOS) is constrained by solana-sdk dependencies:
#   - ed25519-dalek 1.0 (NOT 2.x)
#   - x25519-dalek 1.1 (NOT 2.x)
#   - chacha20poly1305 0.9 (NOT 0.10)
#   - rand 0.7 (NOT 0.8)
#   - zeroize 1.3 (NOT 1.8)
#
# Solution: Server must use the same versions to ensure crypto compatibility
#
# Architecture Overview:
# [BLIND-ISSUER 2026-07-23 by Codex] Private RSA custody lives in a dedicated
# process that deliberately has no dependency on aeronyx-server node state.
# ┌─────────────────────────────────────────────────────────────┐
# │  aeronyx-server    - Main server binary & orchestration     │
# │  aeronyx-blind-issuer - Isolated RFC 9474 signing process   │
# │  aeronyx-core      - Protocol definitions & cryptography    │
# │  aeronyx-transport - Network I/O & TUN device abstraction   │
# │  aeronyx-common    - Shared utilities & types               │
# └─────────────────────────────────────────────────────────────┘
#
# ⚠️ Important Note for Next Developer:
# - Keep dependency versions synchronized with client
# - All crypto library versions MUST match exactly
# - Use workspace inheritance for common dependencies
# - All crates should use the same async runtime (tokio)
#
# Last Modified: v0.2.1-PinnedToolchain - Clarified MSRV versus the exact
# production release compiler declared by rust-toolchain.toml.
# Last Modified: v0.2.0-BlindIssuer - Added an isolated blind-signing process.
# Version alignment fix for client compatibility
# ============================================

[workspace]
resolver = "2"
members = [
    "crates/aeronyx-blind-issuer",
    "crates/aeronyx-core",
    "crates/aeronyx-transport",
    "crates/aeronyx-server",
    "crates/aeronyx-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# [MEMCHAIN-PHALA-ACI-VERIFIER 2026-10-05 by Codex] The official Phala ACI
# verifier integration requires Rust 1.89; release builds remain pinned below.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aeronyx/aeronyx-server"
authors = ["AeroNyx Contributors"]
keywords = ["privacy", "network", "encryption", "tunnel"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
# ============================================
# Async Runtime & Utilities
# ============================================
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures = "0.3"

# ============================================
# Cryptography (RustCrypto - security audited)
# ============================================
# ⚠️ CRITICAL: These versions MUST match client exactly!
# Client is constrained by solana-sdk which requires older versions.
# DO NOT upgrade these without also upgrading client dependencies.
#
# Version mapping (Server ← must match → Client):
#   ed25519-dalek:      1.0  ←→  1.0  ✓
#   x25519-dalek:       1.1  ←→  1.1  ✓
#   chacha20poly1305:   0.9  ←→  0.9  ✓
#   rand:               0.7  ←→  0.7  ✓
#   zeroize:            1.3  ←→  1.3  ✓
# ============================================
ed25519-dalek = "1.0"
# [MEMCHAIN-PHALA-ACI-RECEIPT-COMPAT 2026-10-06 by Codex] Verify ACI secp256k1 receipts.
k256 = { version = "0.13.4", features = ["ecdsa"] }
x25519-dalek = "1.1"
chacha20poly1305 = "0.9"
hkdf = "0.12"
sha2 = "0.10"
# [PHALA-133171-PROFILE 2026-10-08 by Codex] Dstack KMS recovery hashes.
sha3 = "0.10"
rand = "0.7"
rand_core = "0.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
rustls-native-certs = "0.8"
# [MEMCHAIN-PHALA-ACI-VERIFIER 2026-10-05 by Codex] Pin the upstream ACI
# mechanism helpers to one reviewed source revision; relying-party policy
# and hardware-quote appraisal remain in aeronyx-server.
# [PHALA-133171-PROFILE 2026-10-08 by Codex] These crates provide JCS and
# hardened quote/event-log mechanisms, NOT the 133171 ACI report wire types.
aci-protocol = { git = "https://github.com/Dstack-TEE/private-ai-gateway", rev = "a991c08553cbd0638199abfd6eace9c83ee0a891" }
aci-verify = { git = "https://github.com/Dstack-TEE/private-ai-gateway", rev = "a991c08553cbd0638199abfd6eace9c83ee0a891" }
dcap-qvl = { version = "0.3.12", default-features = false, features = ["std", "report", "rustcrypto"] }
zeroize = { version = "1.3", features = ["zeroize_derive"] }

# ============================================
# Serialization & Configuration
# ============================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.21"
bytes = "1.7"
hex = "0.4"

# ============================================
# Error Handling
# ============================================
thiserror = "1.0"
anyhow = "1.0"

# ============================================
# Logging & Observability
# ============================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ============================================
# Networking
# ============================================
socket2 = { version = "0.5", features = ["all"] }

# ============================================
# System & Platform
# ============================================
# [BLIND-VAULT-RECOVERY-IO-BUILD 2026-08-31 by Codex] The recovery adapter
# enumerates only adapter-owned temporary entries through nix::dir.
nix = { version = "0.29", features = ["net", "ioctl", "fs", "dir"] }
libc = "0.2"

# ============================================
# CLI
# ============================================
clap = { version = "4.5", features = ["derive", "env"] }

# ============================================
# Utilities
# ============================================
parking_lot = "0.12"
dashmap = "6.0"
arc-swap = "1.7"
pin-project-lite = "0.2"

# ============================================
# Testing
# ============================================
criterion = "0.5"
proptest = "1.5"
test-case = "3.3"

# ============================================
# Internal Crates
# ============================================
aeronyx-core = { path = "crates/aeronyx-core" }
aeronyx-transport = { path = "crates/aeronyx-transport" }
aeronyx-server = { path = "crates/aeronyx-server" }
aeronyx-common = { path = "crates/aeronyx-common" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

# ============================================
# Build Profiles
# ============================================
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# [PHALA-UNWIND-BUILD-CONTRACT 2026-10-07 by Codex] Reverse owners must
# unwind into ordered durable-work drain. Keep the ordinary release ABI/policy
# unchanged; the Phala image selects this explicit profile and artifact path.
[profile.phala]
inherits = "release"
panic = "unwind"

[profile.bench]
debug = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev-optimized]
inherits = "dev"
opt-level = 2
