# ============================================
# File: deploy/node/server.example.toml
# ============================================
# Creation Reason:
# - Provide a production-safe, version-controlled configuration template for
#   commercial AeroNyx privacy nodes.
#
# Modification Reason:
# - [CUSTODY-RENEWAL-LIFECYCLE 2026-08-18 by Codex] Clarify edge-triggered
#   renewal warning and recovery behavior.
# - [CUSTODY-QUORUM-EXPIRY 2026-08-18 by Codex] Clarify local pre-expiry
#   warnings derived from the exact accepted threshold set.
# - [CUSTODY-WITNESS-RUNTIME-GUARD 2026-08-18 by Codex] Document the separate
#   default-off local runtime re-audit and controlled shutdown policy.
# - [CUSTODY-WITNESS-STARTUP-GATE 2026-08-18 by Codex] Document the default-off
#   local receipt threshold that can block startup without network I/O.
# - [CUSTODY-WITNESS-OPERATOR-COLLECT 2026-08-18 by Codex] Document the
#   explicit signed-snapshot network collection command and its non-scheduled
#   transport boundary.
# - [CUSTODY-WITNESS-VAULT-AUDIT 2026-08-17 by Codex] Document the explicit
#   host-local command that re-audits current-checkpoint receipt readiness.
# - [CUSTODY-WITNESS-RECEIPT-IMPORT 2026-08-17 by Codex] Document that manual
#   producer import is current-checkpoint and pin gated while remaining local.
# - [CUSTODY-WITNESS-RECEIPT-VAULT 2026-08-16 by Codex] Clarify that explicit
#   witness rounds persist portable signed receipts, while configuration alone
#   still performs no network transmission.
# - [CHAT-RELAY-BACKUP-PRUNE 2026-08-16 by Codex] Document bounded custody
#   backup retention and the minimum partial-file grace used only by explicit
#   host-local maintenance commands.
# - [RUNTIME-IDENTITY-POLICY 2026-07-29 by Codex] Clarify that every pinned
#   coordinator/witness identity must be external to the configured node.
# - [FOLLOWER-CERTIFICATE-CONFIG 2026-07-29 by Codex] Document the independent
#   witness policy that lets a follower verify and recover current-tip
#   certificates without granting carriers block-production authority.
# - Delay optional Directory proof gossip until exact block anchors have had
#   two normal replica-sync intervals to converge on healthy peers.
# - Add bounded concurrent discovery gossip so one slow public peer cannot
#   serialize and delay the complete peer round.
# - Document the bounded independent Directory checkpoint witness target. This
#   is corroboration evidence only, not consensus, fork choice, or finality.
# - Add an explicit opt-in ChatRelay blind relay capability block so operators
#   understand why peer quorum remains below route-ready until relay service,
#   public peer API, and self-advertisement are all intentionally enabled.
# - Document discovery peer-store, public peer API, and explicit onion-middle
#   advertisement controls for future no-exit multi-hop relay planning.
# - Document vpn.transports capability metadata for commercial transport
#   readiness. Phase 1 remains UDP-only at the data-plane runtime.
# - Document vpn.dns_proxy_enabled so operators can explicitly choose whether
#   the Rust process or an external host resolver owns gateway_ip:53.
# - Align the default commercial VPN IP pool with the default 1000-session
#   ceiling so new nodes do not start with an IP-pool capacity warning.
# - Initial production node deployment profile. This template separates public
#   defaults from node-private runtime state in /etc/aeronyx.
#
# Main Functionality:
# - Defines VPN listener, virtual IP pool, TUN device, node limits, logging,
#   management heartbeat, and optional MemChain defaults.
#
# Dependencies:
# - Loaded by aeronyx-server via:
#   aeronyx-server start -c /etc/aeronyx/server.toml
# - Installed by deploy/node/install.sh.
# - Validated by deploy/node/healthcheck.sh and aeronyx-server validate.
#
# Main Logical Flow:
# 1. install.sh copies this file to /etc/aeronyx/server.toml if it does not
#    already exist.
# 2. Operators register the node with aeronyx-server register --code <CODE>.
# 3. systemd starts aeronyx-server with the installed config path.
#
# Important Note for Next Developer:
# - Do not put node private keys, registration data, wallet secrets, or user
#   traffic data in this template.
# - Keep this file backward compatible with crates/aeronyx-server/src/config.rs.
# - Existing /etc/aeronyx/server.toml must not be overwritten by install.sh.
#
# Last Modified:
# v1.19.0-node-deploy - Documented crash-safe verified-submit admission bounds.
# v1.18.0-node-deploy - Documented custody renewal warning lifecycle.
# v1.17.0-node-deploy - Documented custody quorum expiry warning behavior.
# v1.16.0-node-deploy - Documented strict runtime custody witness re-auditing.
# v1.15.0-node-deploy - Documented explicit durable witness collection.
# v1.14.0-node-deploy - Documented local current-checkpoint receipt auditing.
# v1.13.0-node-deploy - Documented bounded host-local witness receipt import.
# v1.12.0-node-deploy - Documented durable producer custody witness evidence.
# v1.11.0-node-deploy - Documented relay custody retention/prune policy.
# v1.10.0-node-deploy - Documented runtime identity separation for trust pins.
# v1.9.0-node-deploy - Documented follower checkpoint-certificate witness policy.
# v1.8.0-node-deploy - Added Directory proof gossip maturity guidance.
# v1.7.0-node-deploy - Added bounded discovery gossip concurrency guidance.
# v1.6.0-node-deploy - Added Directory checkpoint witness threshold guidance.
# v1.5.0-node-deploy - Added explicit ChatRelay capability opt-in defaults.
# v1.4.0-node-deploy - Added discovery peer-store and onion-middle controls.
# v1.3.0-node-deploy - Added VPN transport capability metadata defaults.
# v1.2.0-node-deploy - Added DNS proxy ownership flag.
# v1.1.0-node-deploy - Expanded default VPN pool to /22 for 1000-session
#                      commercial capacity.
# v1.0.0-node-deploy - Added production node example config.
# ============================================

[network]
listen_addr = "0.0.0.0:51820"

[vpn]
virtual_ip_range = "100.64.0.0/22"
gateway_ip = "100.64.0.1"
# true: Rust owns gateway_ip:53 with the built-in privacy-safe UDP DNS proxy.
# false: an external host resolver, such as systemd-resolved, must listen on
# gateway_ip:53. The VPN health endpoint still verifies DNS socket/query status.
dns_proxy_enabled = true

[vpn.transports]
# Phase 1: UDP is the only active Rust VPN data-plane carrier.
udp_enabled = true
# TCP/TLS 443 fallback is planned for UDP-blocked networks. Leave disabled
# until the Rust listener and client fallback implementation are deployed.
tcp_tls_enabled = false
# tcp_tls_public_endpoint = "vpn.example.com:443"
# WebSocket over HTTPS is planned for strict proxy networks. Leave disabled
# until the Rust listener and client fallback implementation are deployed.
websocket_enabled = false
# websocket_public_url = "wss://vpn.example.com/aeronyx/vpn"
preferred_transport = "udp"

[tun]
device_name = "aeronyx0"
mtu = 1420

[server_key]
key_file = "/etc/aeronyx/server_key.json"

[limits]
max_connections = 1000
session_timeout = 86400

[logging]
level = "info"

[management]
cms_url = "https://api.aeronyx.network/api/privacy_network"
heartbeat_interval_secs = 30
session_report_interval_secs = 30
request_timeout_secs = 10
max_retries = 3
node_info_path = "/etc/aeronyx/node_info.json"

[discovery]
# Discovery is the node-to-node control plane for signed peer descriptors.
# It never carries chat plaintext, packet payloads, DNS contents, destinations,
# voucher secrets, wallet traffic, or private keys.
enabled = true
advertise_self = true
peer_cache_path = "/var/lib/aeronyx/peers-cache.json"
# [NODE-BOOTSTRAP-DEFAULTS 2026-08-02 by Codex] New nodes need both a signed
# snapshot path for restart recovery and independent live seeds for gossip.
# Operators may replace these endpoints, but should keep at least two nodes
# under separate infrastructure control to avoid a single bootstrap dependency.
bootstrap_snapshot_path = "/etc/aeronyx/bootstrap-peers.json"
seed_endpoints = [
  "http://8.213.146.244:8422",
  "http://149.33.18.44:8422",
  "http://111.68.15.70:8422",
]
# Optional signed local Directory Chain journal. Once configured, startup
# verifies every stored block, chain link, Merkle root, producer, and
# commitment index before the service proceeds. This database contains public
# node descriptor commitments only; never point it at the peer cache or a
# MemChain/chat database.
# directory_chain_path = "/var/lib/aeronyx/directory-chain.db"
# Operator-pinned authority producers for Directory Sync, observation
# checkpoints, external witness recomputation, and policy-head anchors.
# Permissionless mirrors never enter this authority set.
directory_chain_sync_peer_node_ids = []
# Pulls at most one producer block per pinned peer each round. Keep this at 60
# seconds or higher so descriptor-object hydration stays within peer rate limits.
directory_chain_sync_interval_secs = 120
# [DIRECTORY-PROOF-MATURITY 2026-07-28 by Codex] Optional override for the
# minimum signed-block age used by outbound proof gossip. Omit this field to
# derive two directory_chain_sync_interval_secs automatically. An explicit
# value cannot be lower than that safe floor. This delays only optional proof
# publication; legacy descriptor/snapshot gossip remains immediate.
directory_gossip_proof_min_age_secs = 240
# Optional Full-node Mirror Mode. Verified public discovery peers may exchange
# this node's own signed public Directory history and may be mirrored directly.
# Mirror data is untrusted replicated evidence: it never votes, selects forks,
# contributes to checkpoints/witness thresholds, or establishes finality.
# Disabled by default. Requires directory_chain_path when enabled.
directory_full_node_mirror_enabled = false
# [MIRROR-CAPABILITY 2026-07-24 by Codex] Staged signed capability rollout.
# Keep false until every discovery peer has upgraded to a decoder that knows
# DirectoryMirrorCarrier. Enabling requires Mirror Mode, public discovery, a
# public endpoint, and the public discovery API listener.
advertise_directory_mirror_carrier = false
# Durable mirror namespace ceiling (1-64). Existing operator-pinned producers
# do not consume this capacity. No automatic eviction is performed in V1.
directory_full_node_mirror_max_producers = 32
# Number of distinct current Directory Sync pins that must independently
# recompute the same mature local observation checkpoint. Valid range: 1-16,
# and it cannot exceed directory_chain_sync_peer_node_ids. Existing nodes keep
# one-receipt behavior. Use 2 or more only after compatible pins are deployed.
# This is corroboration evidence; it is not a vote, consensus, or finality.
directory_observation_witness_min_verified = 1
peer_cache_write_interval_secs = 120
# Optional external rollback witness for the signed verified-delivery cache.
# Each pin is a 32-byte node Ed25519 identity in hexadecimal. Witnesses retain
# only this node id, a monotonic generation, an opaque digest, and observation
# time; no delivery count/time, route, message id, payload, endpoint, or client
# metadata is sent. Keep disabled until the pinned nodes run the compatible
# peer API and this node uses a local [memchain] storage mode.
verified_delivery_witness_node_ids = []
verified_delivery_witness_min_verified = 1
verified_delivery_witness_required_for_restore = false
# Witness-side admission is bilateral and independent of permissionless peer
# discovery. List only requester node identities this node explicitly agrees
# to protect. Empty means the witness endpoint refuses every write.
verified_delivery_witness_requester_node_ids = []
# [CUSTODY-WITNESS-STARTUP-GATE 2026-08-18 by Codex] Producer-side independent
# custody witness candidates. PeerStore startup planning evaluates fresh
# authenticated EncryptedStorage descriptors with public-safe endpoints and
# logs aggregate readiness. An explicitly invoked durable round stores signed
# receipts in a bounded local vault and revalidates them after restart. The
# host-local import command accepts only a current producer checkpoint and a
# witness from this pin set; it does not contact the witness over the network.
# Configuration/startup still sends nothing, and an empty list remains fully
# off. Operators may explicitly run
# `relay-custody collect-audit-witnesses --discovery-snapshot <signed-json>`;
# it filters the snapshot to this exact pin set, verifies every descriptor,
# persists signed receipts before counting them, and exits non-zero unless the
# current checkpoint threshold is ready. After collecting/importing receipts, use
# `relay-custody audit-witness-vault --max-age-seconds 7200 --json` to re-audit
# the current checkpoint locally; add `--require-ready` only to an explicitly
# operator-managed health gate.
custody_audit_witness_node_ids = []
# Required eligible candidates for the local dry-run plan. Valid range 1-3 and
# never greater than custody_audit_witness_node_ids.
custody_audit_witness_min_verified = 1
# Default false preserves existing deployments. When true, startup regenerates
# the exact current ChatRelay custody anchor and requires the configured count
# of fresh accepted receipts already present in the local MemChain vault. It
# performs no network I/O; missing, expired, conflicting, stale, gap, malformed,
# or rollback-mismatched evidence stops startup before listeners and gossip.
custody_audit_witness_startup_required = false
# Default false preserves startup-only deployments. When true, the running node
# periodically re-audits the current anchor using only its local durable vault.
# It requires startup_required=true, never collects over the network, and asks
# the existing runtime supervisor to stop the process when readiness is lost.
# Before expiry it emits aggregate-only `receipt_renewal_required` telemetry;
# this warning never contacts witnesses or changes the configured trust policy.
# Each expiry horizon warns once; a later healthy explicit refresh emits one
# `receipt_renewal_recovered` event. Actual audit failure still stops the node.
custody_audit_witness_runtime_required = false
# [CUSTODY-WITNESS-AUTO-RENEWAL 2026-08-21 by Codex] Default false preserves
# the local-only runtime contract above. When true, an expiring quorum triggers
# one bounded concurrent round to these exact pins. Every response is verified
# and durably stored before counting; signed adverse evidence still stops the
# strict runtime. Requires both startup_required and runtime_required = true.
custody_audit_witness_auto_renewal_enabled = false
# Current-anchor receipt freshness window. Valid range 60..=604800 seconds.
# Positive witness clock skew is always capped separately at 60 seconds.
custody_audit_witness_max_age_secs = 7200
# [CUSTODY-WITNESS-NETWORK 2026-08-16 by Codex] Independent producer pins for
# POST /api/memchain/peer/custody-audit-anchor-witness. The endpoint stores
# only producer id, monotonic generation, canonical anchor SHA-256, and time.
# It never receives archive content, record ids, routes, messages, or users.
# Keep empty until a separately operated producer is explicitly reviewed.
custody_audit_witness_requester_node_ids = []
gossip_enabled = true
gossip_interval_secs = 45
gossip_peer_limit = 8
# [DISCOVERY-GOSSIP-ISOLATION 2026-07-28 by Codex] Poll at most this many
# selected peers concurrently. Valid range is 1..=64; runtime also caps this by
# gossip_peer_limit. Eight keeps the default 32-peer round within one cadence
# while bounding sockets, response bodies, and task memory.
gossip_concurrency_limit = 8
gossip_jitter_percent = 15
gossip_backpressure_failure_threshold = 4
gossip_failure_backoff_max_secs = 180
max_peers = 512
max_snapshot_limit = 64
gossip_rate_limit_per_minute = 30
# Set this to the public HTTP(S) endpoint that reaches public_api_listen_addr.
# ChatRelay and OnionMiddle capabilities are not advertised unless this is set,
# which prevents stale or UDP-only VPN endpoints from polluting peer routing.
# public_endpoint = "https://node.example.com"
public_api_listen_addr = "0.0.0.0:8422"
region = "unknown"
descriptor_ttl_secs = 7200
public_discovery = false
# No-exit onion middle-hop capability is opt-in. Leave disabled until the
# operator explicitly wants this node to participate in multi-hop relay paths.
advertise_onion_middle = false

# [BLIND-VAULT-CONFIG 2026-07-23 by Codex] Independent node-blind storage for
# opaque contact-vault and optional message-archive objects. The schema does
# not contain account, wallet, sender, receiver, namespace, social-graph, or
# search-vector fields. Keep it disabled until the operator has provisioned a
# dedicated database and pinned at least one admission issuer or update
# authority.
[blind_vault]
enabled = false
# Public client routes additionally require this explicit gate and at least one
# pinned issuer/update-authority key. V1 Ed25519 bearer tickets remain
# compatible; new deployments should use rotating V2 RFC 9474 RSA issuers.
public_api_enabled = false
# [BLIND-VAULT-REPLICA-CAPABILITY 2026-08-10 by Codex] Append-only signed
# discovery capability. Keep false until the intended mesh
# has upgraded its discovery decoders, then enable only on publicly reachable
# replicas whose admitted API is already healthy.
advertise_replica = false
admission_issuer_public_keys = []
# [BLIND-VAULT-ISSUER-AUTHORITY 2026-07-23 by Codex] These Ed25519 keys may
# sign complete public V2 issuer generations. The authority private key stays
# offline or in the authenticated issuer service and is never copied here.
# Authority-only bootstrap remains fail-closed until the first signed
# generation arrives.
blind_issuer_update_authority_public_keys = []
blind_issuer_update_max_age_secs = 300
max_admission_ticket_ttl_secs = 86400
db_path = "/var/lib/aeronyx/blind-vault.db"
max_lease_ttl_secs = 7776000
max_object_ttl_secs = 2592000
max_objects_per_lease = 16384
max_bytes_per_lease = 268435456
# [BLIND-VAULT-NODE-CAPACITY 2026-08-28 by Codex] These node-wide floors are
# enforced atomically before consuming an admission credential or accepting a
# new ciphertext. Size them below the dedicated volume's operational budget.
max_live_leases = 100000
max_total_ciphertext_bytes = 68719476736
# [BLIND-VAULT-DISK-RESERVE 2026-08-28 by Codex] Preserve 2 GiB on the
# filesystem containing this database. Probe failures reject new admissions
# and puts, while pull/delete/retire/cleanup remain available for recovery.
min_free_disk_bytes = 2147483648
max_pull_objects = 64
tombstone_ttl_secs = 604800
mutation_clock_skew_secs = 300
cleanup_interval_secs = 300

# [BLIND-VAULT-BLIND-ISSUER 2026-07-23 by Codex] Each V2 issuer epoch carries
# only a public RSA key and fixed coarse policy. Never copy the issuer private
# key onto a storage node. The key fingerprint is derived from canonical DER;
# clients include that fingerprint in the blinded, domain-separated message.
# Keep epochs at 31 days or less and overlap rotations only for clock/grace.
# [[blind_vault.blind_admission_issuers]]
# public_key_der_base64 = "BASE64_RSA_PUBLIC_KEY_DER"
# not_before_unix_secs = 1800000000
# expires_at_unix_secs = 1800086400
# max_lease_ttl_secs = 604800

# Commercial VPN nodes should start with MemChain disabled unless the operator
# explicitly wants local memory-chain services on the same machine.
[memchain]
mode = "off"
api_listen_addr = "127.0.0.1:8421"
db_path = "/var/lib/aeronyx/memchain.db"
aof_path = "/var/lib/aeronyx/.memchain"
miner_interval_secs = 60
# Set to false on protocol-only relay nodes that do not install local ONNX
# embedding models. This keeps encrypted storage, public discovery, and
# ChatRelay routes available without noisy model-missing warnings.
embed_enabled = true

# A follower may verify and recover the coordinator's current-tip certificate
# from independently pinned witnesses after signed block/checkpoint convergence.
# This remains default-off: enable commitment_sync_enabled, pin one coordinator,
# then pin 2-3 audited external witnesses and require at least two signatures.
# The coordinator and every witness must differ from this node's own public key;
# startup fails closed when any trust pin is self-referential.
# Do not enable commitment_witness_startup_required or
# commitment_coordinator_lease_required on a follower; both are
# coordinator-only production gates.
# commitment_sync_enabled = true
# commitment_coordinator_node_id = "64_HEX_ED25519_COORDINATOR_NODE_ID"
# Keep this immutable root unchanged across dual-signed coordinator rotation.
# Empty preserves legacy behavior by reusing the source pin on followers or
# the runtime identity on a coordinator. Set it explicitly before handover.
# commitment_authority_root_node_id = "64_HEX_ED25519_GENESIS_AUTHORITY_NODE_ID"
# [AUTHORITY-CARRIER-POLICY 2026-08-14 by Codex] Optional follower-only
# transport pins for dual-signed coordinator handover proofs. These nodes gain
# no witness, coordinator, voting, finality, or fork-choice authority. Empty
# preserves existing deployments by reusing commitment_witness_node_ids;
# a non-empty list replaces that fallback and is capped at three identities.
# commitment_authority_carrier_node_ids = [
#   "64_HEX_ED25519_PROOF_CARRIER_A_NODE_ID",
#   "64_HEX_ED25519_PROOF_CARRIER_B_NODE_ID",
# ]
# commitment_witness_node_ids = [
#   "64_HEX_ED25519_WITNESS_A_NODE_ID",
#   "64_HEX_ED25519_WITNESS_B_NODE_ID",
# ]
# commitment_witness_min_verified = 2

# Cross-host duplicate-coordinator fencing is intentionally default-off.
# Before enabling it, upgrade every identity in commitment_witness_node_ids,
# require strict startup witness evidence, and verify that all pins can grant
# the same audited chain tip. This lease is an operational safety control, not
# consensus, leader election, finality, or fork choice.
commitment_coordinator_lease_required = false
commitment_coordinator_lease_ttl_secs = 120

# ChatRelay is a blind store-and-forward relay for E2E-encrypted chat and
# media envelopes. It is intentionally disabled by default. To advertise this
# node as a routeable ChatRelay peer, all three conditions must be true:
# 1. [memchain.chat_relay].enabled = true
# 2. [discovery].public_endpoint points to this node's public peer API
# 3. [discovery].public_api_listen_addr is reachable by peers
#
# The relay stores only ciphertext blobs and metadata needed for delivery; it
# must never inspect chat plaintext, message content, DNS contents, client
# public IPs, destinations, browsing history, wallet-level traffic, or private
# keys.
[memchain.chat_relay]
enabled = false
offline_ttl_secs = 259200
max_pending_per_wallet = 500
# Node-wide ceilings prevent synthetic receiver identities from bypassing the
# per-wallet mailbox quota. Existing configs may omit these fields and use the
# backward-compatible defaults shown here.
max_pending_messages_total = 100000
max_pending_message_bytes_total = 536870912
db_path = "/var/lib/aeronyx/chat_pending.db"
max_message_size = 65536
max_blob_size = 10485760
max_blobs_per_receiver = 50
max_pending_blobs_total = 5000
max_pending_blob_bytes_total = 2147483648
cleanup_interval_secs = 60
# [CRASH-SAFE-VERIFIED-SUBMIT-ADMISSION 2026-08-24 by Codex] This node-wide
# value also bounds short-lived durable verified-submit responses and pending
# reservations. When full, the node rejects a new verified submit before any
# route/custody side effect; it never evicts unexpired replay evidence early.
dedup_lru_capacity = 10000
expired_notification_ttl_secs = 604800
# [PEER-RELAY-ADMISSION 2026-08-15 by Codex] Global parser-front ceiling shared
# by direct relay v1/v2. It intentionally uses no node, user, receiver, or IP
# bucket and remains mandatory against permissionless identity rotation.
peer_relay_requests_per_minute = 1200
# [AUTHENTICATED-PEER-FAIRNESS 2026-08-15 by Codex] Post-signature fairness
# ceiling for one verified direct-relay v2 previous-hop node identity.
peer_relay_authenticated_requests_per_minute = 240
# [CHAT-RELAY-BACKUP-PRUNE 2026-08-16 by Codex] These are planning targets,
# not background deletion triggers. The host-local prune command defaults to
# dry-run, always preserves the newest verified recovery image, and requires
# explicit confirmation before deleting policy-excess artifacts.
custody_backup_retention_target_artifacts = 8
custody_backup_retention_target_bytes = 8589934592
# Interrupted private SQLite files remain untouched for at least 24 hours.
custody_backup_partial_grace_secs = 86400
